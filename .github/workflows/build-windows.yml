name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          $ok = $false
          foreach ($i in 1..6) {
            Write-Host "FFmpeg download attempt $i"
            if (Test-Path ffmpeg.zip) { Remove-Item ffmpeg.zip -Force }
            & curl.exe -L --fail --retry 3 --retry-delay 5 --retry-all-errors -o ffmpeg.zip $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path ffmpeg.zip) -and ((Get-Item ffmpeg.zip).Length -gt 1MB)) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { throw 'Could not download FFmpeg (BtbN latest is often rewritten mid-upload)' }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem -Path ffmpeg-tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path vendor/win | Out-Null
          Get-ChildItem -Path "$($bin.FullName)/bin" -File |
            Where-Object { $_.Name -notlike 'ffplay*' } |
            Copy-Item -Destination vendor/win
          Copy-Item "$($bin.FullName)/LICENSE.txt" vendor/win/FFMPEG-LICENSE.txt

      - name: Build installer
        run: node scripts/build.mjs win

      - uses: actions/upload-artifact@v4
        with:
          name: konverter-mts-windows
          path: dist/Konverter-MTS-Setup-*.exe
          retention-days: 30

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Konverter-MTS-Setup-*.exe
          generate_release_notes: true

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg
        run: npm run vendor:mac

      - name: Build disk image
        run: node scripts/build.mjs mac

      - uses: actions/upload-artifact@v4
        with:
          name: konverter-mts-macos
          path: dist/Konverter-MTS-*.dmg
          retention-days: 30

      - name: Attach disk image to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Konverter-MTS-*.dmg
          generate_release_notes: false
